const VERTEX = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";

function glLayer({ canvas, fragment, view, camera, uniforms = [], fixed = {}, extensions = [], maxRatio = 1.5, onError = (message) => console.error(message) }) {

    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);

    return null;

    const box = canvas.getBoundingClientRect();
    const ratio = Math.min(maxRatio, window.devicePixelRatio || 1);
    const width = Math.max(1, Math.round(box.width * ratio));
    const height = Math.max(1, Math.round(box.height * ratio));

      canvas.height = height;
    }

    gl,
    extensions: enabled,
    set(values = {}) {
      for (const [name, value] of Object.entries(values)) set(name, value);
    },
    draw(values = {}, time = 0) {
      fit();
      gl.viewport(0, 0, canvas.width, canvas.height);
      set("uCanvas", [canvas.width, canvas.height]);
      set("uView", view);
      set("uOrigin", camera.origin);
      set("uK", camera.k);
      set("uCam", camera.cam);
      set("uTime", time);
      for (const [name, value] of Object.entries(values)) set(name, value);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      painted = true;
    },
    clear() {
      if (!painted) return;
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);

    },

const smooth = (a, b, x) => {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};

const burst = (age, rise, fall) => (age > 0 ? smooth(0, rise, age) * Math.exp(-Math.max(0, age - rise) / fall) : 0);

function settle(state, target, dt, seconds, calm = false) {
  if (calm) {
    state.x = target;
    state.v = 0;
    return false;
  }
  const w = 1 / seconds;
  for (let index = 0; index < 4; index++) {
    const h = dt / 4;
    state.v += (w * w * (target - state.x) - 2 * w * state.v) * h;
    state.x += state.v * h;
  }
  if (Math.abs(target - state.x) < 1e-4 && Math.abs(state.v) < 1e-4) {
    state.x = target;
    state.v = 0;
    return false;
  }
  return true;
}
// Ripple tank physics: capillary-gravity waves on shallow water, two in-phase
// point sources, and the lens action of the rippled surface on a lamp's light.
// Pure functions, no DOM. The build inlines this file with `export ` removed,
// so it must stay valid as a plain script (no imports, no export lists).

const WATER = {
  depth: 0.006, // m
  gravity: 9.81, // m/s^2
  tension: 0.0728, // N/m
  density: 998, // kg/m^3
  index: 1.333,
  viscosity: 1.0e-6, // m^2/s, kinematic
  glassIndex: 1.52,
};

const RANGE = { f: [8, 28], d: [20, 80] };
const START = { f: 16, d: 50 };
const BEAT = 0.75; // Hz: the strobe runs this much slower than the dippers
const STEEPNESS = 0.03; // ka
const REACH = 24; // mm: near-source length of the spreading law

const TWO_PI = Math.PI * 2;

// omega(k) for k in 1/m, finite depth.
function omegaOf(k, water = WATER) {
  const { gravity, tension, density, depth } = water;
  return Math.sqrt((gravity * k + (tension * k ** 3) / density) * Math.tanh(k * depth));
}

// Invert the dispersion relation by bisection. Returns k in 1/m.
function wavenumberOf(f, water = WATER) {
  const target = TWO_PI * f;
  let lo = 1;
  let hi = 20000;
  for (let pass = 0; pass < 80; pass++) {
    const mid = 0.5 * (lo + hi);
    if (omegaOf(mid, water) < target) lo = mid;
    else hi = mid;
  }
  return 0.5 * (lo + hi);
}

// Everything about one travelling wave at frequency f, in SI units.
function waveOf(f, water = WATER) {
  const k = wavenumberOf(f, water);
  const omega = TWO_PI * f;
  const dk = k * 1e-5;
  const group = (omegaOf(k + dk, water) - omegaOf(k - dk, water)) / (2 * dk);
  const nu = water.viscosity;
  const bulk = 2 * nu * k * k;
  const bottom = (k * Math.sqrt((nu * omega) / 2)) / Math.sinh(2 * k * water.depth);
  const damping = bulk + bottom; // 1/s, amplitude
  return {
    k,
    wavelength: TWO_PI / k,
    phase: omega / k,
    group,
    damping,
    decay: damping / group, // 1/m
  };
}

const nodalCount = (d, wavelength) => 2 * Math.floor(d / wavelength + 0.5);

// Where the nodal hyperbolas cross the line through both dippers, measured from the midpoint.
function nodalVertices(d, wavelength) {
  const out = [];
  for (let m = 0; (m + 0.5) * wavelength < d; m++) {
    const at = ((m + 0.5) * wavelength) / 2;
    out.push(-at, at);
  }
  return out.sort((a, b) => a - b);
}

// Point lamp at height lamp, water surface at water, paper at paper.
const magnificationOf = ({ lamp, water, paper }) => (lamp - paper) / (lamp - water);

// The lens lever: how far a unit surface slope moves the light on the paper, referred
// back to the water plane. Refraction at the surface tilts the ray by (1 - 1/n) of the
// slope; the tilt then grows through water, glass and air by each medium's index ratio.
function causticDistanceOf({ lamp, water, floor, bed, paper }, medium = WATER) {
  const n = medium.index;
  const tilt = 1 - 1 / n;
  const lever = tilt * ((water - floor) + (floor - bed) * (n / medium.glassIndex) + (bed - paper) * n);
  return lever / magnificationOf({ lamp, water, paper });
}

// Fraction of a crest's focal length at which the paper sits: D * a * k^2, k per mm.
const focusOf = (caustic, amplitude, kmm) => caustic * amplitude * kmm * kmm;

function stateOf(f, d, optics) {
  const wave = waveOf(f);
  const kmm = wave.k / 1000;
  const amplitude = STEEPNESS / kmm;
  return {
    f,
    d,
    wavelength: wave.wavelength * 1000,
    k: kmm,
    phase: wave.phase,
    group: wave.group,
    decay: wave.decay / 1000,
    damping: wave.damping,
    nodal: nodalCount(d, wave.wavelength * 1000),
    strobe: f - BEAT,
    amplitude,
    focus: focusOf(optics.caustic, amplitude, kmm),
    projected: wave.wavelength * 1000 * optics.magnification,
  };
}

const readoutOf = (s) =>
  `f ${s.f.toFixed(1)} Hz · λ ${(s.wavelength / 10).toFixed(2)} cm · d ${(s.d / 10).toFixed(1)} cm · ${s.nodal} nodal lines`;

const spokenOf = (s) =>
  `${s.f.toFixed(1)} hertz, wavelength ${(s.wavelength / 10).toFixed(2)} centimetres, dippers ${(s.d / 10).toFixed(1)} centimetres apart, ${s.nodal} nodal lines`;

// Cast a water-surface point from the lamp down onto the paper plane.
function castOnPaper([x, y], lamp, water, paper) {
  const t = (lamp[2] - paper) / (lamp[2] - water);
  return [lamp[0] + (x - lamp[0]) * t, lamp[1] + (y - lamp[1]) * t, paper];
}

// Split a polyline into the runs that lie inside the box, dropping single points.
function clipRuns(points, [x0, y0, x1, y1]) {
  const runs = [];
  let run = [];
  for (const point of points) {
    const inside = point[0] >= x0 && point[0] <= x1 && point[1] >= y0 && point[1] <= y1;
    if (inside) run.push(point);
    else {
      if (run.length > 1) runs.push(run);
      run = [];
    }
  }
  if (run.length > 1) runs.push(run);
  return runs;
}

function polylineD(points, project) {
  return points
    .map((point, index) => {
      const [sx, sy] = project(point);
      return `${index ? "L" : "M"}${sx.toFixed(1)} ${sy.toFixed(1)}`;
    })
    .join("");
}

// The SVG fallback: nodal hyperbolas and crest circles, cast onto the paper.
// geometry: { x, inside: [x0, y0, x1, y1], lamp: [x, y, z], water, paper }.
function patternOf(state, geometry, project, phase) {
  const { x: dipX, inside, lamp, water, paper } = geometry;
  const [x0, y0, x1, y1] = inside;
  const lam = state.wavelength;
  const c = state.d / 2;
  const toPaper = (runs) => runs.map((run) => polylineD(run.map((p) => castOnPaper(p, lamp, water, paper)), project)).join("");

  const nodalRuns = [];
  const reachX = Math.max(dipX - x0, x1 - dipX);
  for (const a of nodalVertices(state.d, lam)) {
    const half = Math.abs(a);
    const b = Math.sqrt(Math.max(c * c - half * half, 1e-6));
    const span = Math.asinh(reachX / b) + 0.05;
    const steps = 72;
    const points = [];
    for (let step = 0; step <= steps; step++) {
      const t = -span + (2 * span * step) / steps;
      // Hyperbola with foci on the y axis through the dippers: y along the dipper line, x across it.
      points.push([dipX + b * Math.sinh(t), Math.sign(a) * half * Math.cosh(t)]);
    }
    nodalRuns.push(...clipRuns(points, inside));
  }

  const crestRuns = [];
  const fraction = (((phase / TWO_PI) % 1) + 1) % 1;
  const far = Math.max(...[[x0, y0], [x1, y0], [x0, y1], [x1, y1]].map(([px, py]) => Math.hypot(px - dipX, py) + c));
  for (const sy of [-c, c]) {
    for (let r = lam * (1 + fraction); r <= far; r += lam) {
      const steps = Math.max(24, Math.ceil((TWO_PI * r) / 3));
      const ring = [];
      for (let step = 0; step <= steps; step++) {
        const angle = (TWO_PI * step) / steps;
        ring.push([dipX + r * Math.cos(angle), sy + r * Math.sin(angle)]);
      }
      crestRuns.push(...clipRuns(ring, inside));
    }
  }
  return { nodal: toPaper(nodalRuns), crests: toPaper(crestRuns) };
}

        upload(layers.paper);
        layers.paper.draw(values, 0);
      }
      if (lamp <= 0) layers.water.clear();
      else {
        upload(layers.water);
        layers.water.draw(values, 0);
      }
    } catch (error) {
      layers = null;
    }
  }

  // ---- SVG ----
  const shown = { readout: readout ? readout.textContent : "", f: D.start.f, d: D.start.d };
  const setAttr = (node, name, value) => {
    if (node && node.getAttribute(name) !== value) node.setAttribute(name, value);
  };
  const dialDir = (f) => {
    const a = ((-135 + (270 * (f - F0)) / (F1 - F0)) * Math.PI) / 180;
    return [Math.sin(a), -Math.cos(a)];
  };
  function drawSvg() {
    const bob = model.amplitude * Math.sin(phase);
    setAttr(parts.far, "transform", translateAlong(P, [0, -gap.x / 2, bob]));
    setAttr(parts.near, "transform", translateAlong(P, [0, gap.x / 2, bob]));
    setAttr(parts.bar, "transform", translateAlong(P, [0, 0, bob]));
    setAttr(parts.motor, "transform", translateAlong(P, [0, 0, bob]));
    const [ex, ey, ez, offset, radius] = D.eccentric;
    setAttr(parts.eccentric, "d", sideRing([ex, ey + offset * Math.cos(phase), ez + offset * Math.sin(phase)], radius, "x", P, 20));
    const [dx, dy] = dialDir(freq.x);
    const [kx, ky, kz, kr] = D.knob;
    setAttr(parts.pointer, "d", lineOnTop([kx + dx * 1.8, ky + dy * 1.8], [kx + dx * (kr - 1.2), ky + dy * (kr - 1.2)], kz + 0.01, P));
    const [mx, my, mz, ml] = D.meter;
    setAttr(parts.needle, "d", lineOnTop([mx - dx * 2, my - dy * 2], [mx + dx * ml, my + dy * ml], mz, P));
    stage.style.setProperty("--rt-lamp", lamp.toFixed(3));
    const text = readoutOf(model);
    if (readout && text !== shown.readout) {
      readout.textContent = text;
      shown.readout = text;
    }
    if (!layers && (Math.abs(freq.x - shown.f) > 0.01 || Math.abs(gap.x - shown.d) > 0.1)) {
      shown.f = freq.x;
      shown.d = gap.x;
      const { nodal, crests } = patternOf(model, D.pattern, (point) => iso(point, P), D.startPhase);
      setAttr(parts.nodal, "d", nodal);
      setAttr(parts.crests, "d", crests);
    }
  }

  // ---- Loop ----
  let frame = 0;
  let last = 0;
  let visible = false;
  function tick(now) {
    const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
    last = now;
    const calm = still.matches;
    if (calm && touring) touring = false;
    if (touring) {
      tourClock += dt;
      blendClock += dt;
      const [tf, td] = tourAt(tourClock);
      const share = smooth(0, 2.4, blendClock);
      state.tf = clampF(tourFrom[0] + (tf - tourFrom[0]) * share);
      state.td = clampD(tourFrom[1] + (td - tourFrom[1]) * share);
    }
    const movingF = settle(freq, state.tf, dt, 0.625, calm);
    const movingD = settle(gap, state.td, dt, 0.4, calm);
    if (freq.x !== model.f || gap.x !== model.d) model = stateOf(freq.x, gap.x, D.optics);
    if (!calm) {
      simTime += dt;
      phase = (phase + TAU * D.beat * dt) % TAU;
      truePhase += TAU * freq.x * dt;
      move = Math.min(1.5, Math.abs(model.k - lastK) * 120);
    } else move = 0;
    lastK = model.k;
    if (layers) {
      if (calm) lamp = 1;
      else {
        lampClock += dt;
        lamp = smooth(0, 1, (lampClock - 0.15) / 0.9);
      }
    }
    drawSvg();
    drawGl(calm);
    const busy = touring || movingF || movingD || !calm || (layers && lamp < 1);
    frame = visible && busy ? requestAnimationFrame(tick) : 0;
  }
  function run() {
    if (!frame && visible) {
      last = 0;
      frame = requestAnimationFrame(tick);
    }
  }
  new IntersectionObserver(
    (entries) => {
      visible = entries[entries.length - 1].isIntersecting;
      if (visible) run();
    },
    { rootMargin: "120px 0px" },
  ).observe(stage);
  addEventListener("resize", run);
  const onMotion = () => {
    if (still.matches) {
      touring = false;
      clearTimeout(tourTimer);
    } else {
      clearTimeout(tourTimer);
      tourTimer = setTimeout(beginTour, 1400);
    }
    run();
  };
  if (still.addEventListener) still.addEventListener("change", onMotion);
})();
</script></body></html>
