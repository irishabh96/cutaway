ue"><path d="M1.5 5h13"/></svg>The coiled cord from the keyboard to the side port</span></span><span class="iso-caption">An all-in-one desk computer in the spirit of 1984: a CRT in a tall case, with a floppy slot and a speaker grille under it and vents and a rocker switch on its side. Focus it and type: the keys go down and the characters land on the screen beneath the Anthropic mark. Backspace and Return work. Escape or a click on the case switches it off, and the picture collapses to a line and a dot, as a CRT does.</span></figcaption></figure></main><script type="module">if(new URLSearchParams(location.search).has("embed"))document.body.classList.add("iso-embed");const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;

function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}

    const { sinA, cosA } = cameraOf(projection);

    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;

const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");

function pathOf(points, closed = false) {
    if (!points.length)

function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],

const P = {"origin":[318.4637369275707,254.15429174211067],"scale":1.4138254852679217,"azimuth":55,"elevation":30};

const s = { line: "", last: "", on: true, since: 9, drawnLine: null, text: "" };

    s.line = "";
    s.last = "";
